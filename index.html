<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#085c2c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChemBase BUK" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>ChemBase BUK</title>
    <meta name="description" content="Official academic resource hub for NSCHE BUK - past questions, GPA calculator, academic help, AI assistant and society legacy" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"></noscript>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  </head>
  <body style="margin:0;padding:0;">
    <style>@keyframes spl{from{opacity:0}to{opacity:1}}</style>
    <div id="splash" aria-hidden="true" style="position:fixed;inset:0;z-index:99999;background:#fefefe;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s ease;">
      <img src="/icon-512.png" alt="" style="width:min(66.7vw,340px);height:auto;display:block;" />
      <div style="position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);text-align:center;animation:spl .5s ease .15s both;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
        <div style="font-size:24px;font-weight:800;letter-spacing:.4px;color:#0e7a3c;">ChemBase BUK</div>
        <div style="font-size:12px;letter-spacing:.8px;color:#6b7a70;margin-top:6px;">NSChE · Bayero University Kano</div>
      </div>
    </div>
    <script>
      (function(){
        var t0=Date.now(), el=document.getElementById('splash');
        // The installed Android app already shows its own opening screen, so skip ours there (one screen only).
        try{ if(/Android/i.test(navigator.userAgent) && window.matchMedia('(display-mode: standalone)').matches){ el.parentNode.removeChild(el); return; } }catch(e){}
        function hide(){ if(!el) return; var e=el; el=null; e.style.opacity='0'; e.style.pointerEvents='none'; setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },400); }
        var iv=setInterval(function(){
          var r=document.getElementById('root'), age=Date.now()-t0;
          if((r && r.childElementCount>0 && age>=2200) || age>4500){ clearInterval(iv); hide(); }
        },100);
      })();
    </script>
    <script>
      // Keep installed copies fresh: when the app comes back to the screen, check for a newer build and reload.
      (function(){
        var s=document.querySelector('script[type="module"][src*="/assets/"]'); if(!s) return;
        var cur=s.getAttribute('src');
        function check(){
          try{
            var last=+sessionStorage.getItem('cb_upd')||0; if(Date.now()-last<120000) return;
            fetch('/?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
              var m=t.match(/\/assets\/index-[^"']+\.js/);
              if(m && cur.indexOf(m[0])<0){
                var ta=document.querySelector('textarea'); if(ta && ta.value) return;
                try{ if(window.speechSynthesis && window.speechSynthesis.speaking) return; }catch(e){}
                try{ sessionStorage.setItem('cb_upd',String(Date.now())); }catch(e){}
                location.reload();
              }
            }).catch(function(){});
          }catch(e){}
        }
        document.addEventListener('visibilitychange',function(){ if(!document.hidden) check(); });
        window.addEventListener('focus',check);
        setTimeout(check,4000); setInterval(check,300000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
